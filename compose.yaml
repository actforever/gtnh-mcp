services:
  mcp:
    build: .
    image: gtnh-mcp:local
    # Rebuild the installed package from this checkout before each `up`.
    pull_policy: build
    network_mode: host
    restart: unless-stopped
    env_file: .env
    volumes:
      - runtime:${RUNTIME_DIR:-/run/gtnh}
    depends_on:
      restore:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; h=os.environ.get('MCP_HOST','127.0.0.1'); h='127.0.0.1' if h=='0.0.0.0' else h; h='[::1]' if h=='::' else ('['+h+']' if ':' in h else h); urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://'+h+':'+os.environ.get('MCP_PORT','8000')+'/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3

  restore:
    build: .
    image: gtnh-mcp:local
    pull_policy: build
    command: [gtnh-restore]
    user: "0:10001"
    group_add:
      - ${DOCKER_GID:?Set DOCKER_GID from the Docker socket group}
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 35m
    env_file: .env
    environment:
      CONTAINER_NAME: ${GTNH_CONTAINER_NAME:?Set GTNH_CONTAINER_NAME}
    volumes:
      - runtime:${RUNTIME_DIR:-/run/gtnh}
      - restore-state:${STATE_DIR:-/state}
      - ${GTNH_SERVER_ROOT:?Set GTNH_SERVER_ROOT}:${SERVER_ROOT:-/gtnh}
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      # HTTP metadata uses localhost; the UDS path selects the connection.
      test: [CMD, python, -c, "import os,httpx; p=os.environ.get('RUNTIME_DIR','/run/gtnh')+'/restore.sock'; c=httpx.Client(transport=httpx.HTTPTransport(uds=p)); c.get('http://localhost/health',timeout=3).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  runtime:
  restore-state:
