x-settings: &settings
  RCON_HOST: ${RCON_HOST:-127.0.0.1}
  RCON_PORT: ${RCON_PORT:-25575}
  RCON_PASSWORD: ${RCON_PASSWORD:?Set RCON_PASSWORD in .env}
  RCON_TIMEOUT: ${RCON_TIMEOUT:-10}
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
  ALLOWED_GROUPS: ${ALLOWED_GROUPS:?Set ALLOWED_GROUPS in .env}
  ADMIN_USERS: ${ADMIN_USERS:-[]}
  RUNTIME_DIR: /run/gtnh

services:
  mcp:
    build: .
    image: gtnh-mcp:local
    network_mode: host
    restart: unless-stopped
    environment:
      <<: *settings
      MCP_HOST: 127.0.0.1
      MCP_PORT: ${MCP_PORT:-8000}
    volumes:
      - runtime:/run/gtnh
    depends_on:
      restore:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['MCP_PORT']+'/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  restore:
    build: .
    image: gtnh-mcp:local
    command: [gtnh-restore]
    user: "0:10001"
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 35m
    environment:
      <<: *settings
      CONTAINER_NAME: ${GTNH_CONTAINER_NAME:?Set GTNH_CONTAINER_NAME}
      SERVER_ROOT: /server
      BACKUP_DIR: /backups
      STATE_DIR: /state
      STOP_TIMEOUT: ${STOP_TIMEOUT:-180}
      STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-900}
      MAX_ARCHIVE_BYTES: ${MAX_ARCHIVE_BYTES:-107374182400}
      MAX_ARCHIVE_MEMBERS: ${MAX_ARCHIVE_MEMBERS:-1000000}
      FREE_SPACE_RESERVE: ${FREE_SPACE_RESERVE:-1073741824}
    volumes:
      - runtime:/run/gtnh
      - restore-state:/state
      - type: bind
        source: ${GTNH_SERVER_ROOT:?Set GTNH_SERVER_ROOT}
        target: /server
        bind:
          create_host_path: false
      - type: bind
        source: ${GTNH_BACKUP_DIR:?Set GTNH_BACKUP_DIR}
        target: /backups
        read_only: true
        bind:
          create_host_path: false
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, python, -c, "import httpx; c=httpx.Client(transport=httpx.HTTPTransport(uds='/run/gtnh/restore.sock')); c.get('http://helper/health',timeout=3).raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 35m

volumes:
  runtime:
  restore-state:
