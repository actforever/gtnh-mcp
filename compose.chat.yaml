# Optional AstrBot-only template for new installations on Linux NAS.
# Reuse an existing AstrBot instance and its data instead of creating another.
name: gtnh-chat

services:
  astrbot:
    image: soulter/astrbot:latest
    container_name: astrbot
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      GTNH_AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
    volumes:
      - ./runtime/astrbot-data:/AstrBot/data
