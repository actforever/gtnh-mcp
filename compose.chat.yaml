# 可选：从零部署 AstrBot + NapCat。适用于 Linux NAS 的 host 网络。
name: gtnh-chat

services:
  astrbot:
    image: soulter/astrbot:latest
    container_name: astrbot
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      GTNH_AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
    volumes:
      - ./runtime/astrbot-data:/AstrBot/data

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MODE: astrbot
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
    volumes:
      - ./runtime/astrbot-data:/AstrBot/data
      - ./runtime/napcat-config:/app/napcat/config
      - ./runtime/napcat-qq:/app/.config/QQ
