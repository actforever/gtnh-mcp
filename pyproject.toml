[project]
name = "gtnh-mcp"
version = "0.1.0"
description = "Authenticated GTNH RCON tools and backup restoration for AstrBot"
readme = "README.md"
authors = [
    { name = "qqa", email = "pineclone@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcrcon==0.7.0",
    "fastmcp>=3.4.7,<4",
    "httpx>=0.28,<1",
    "filelock>=3.16,<4",
    "docker>=7.1,<8",
    "uvicorn>=0.35,<1",
    "pydantic>=2.11,<3",
    "starlette>=1,<2",
]

[project.scripts]
gtnh-mcp = "gtnh_mcp:main"
gtnh-restore = "gtnh_mcp.helper:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not blackbox'"
markers = ["blackbox: independent-process HTTP, RCON and restore acceptance tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
